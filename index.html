<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4D Digital Pottery — Sculpt with Your Hands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- LeapJS pre-built browser bundle (avoids Vite/Node module issues) -->
    <script src="/leap.min.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas-3d"></canvas>

      <!-- HUD: Leap status -->
      <div id="hud">
        <p id="leap-status">Connecting to Leap Motion…</p>
      </div>

      <!-- Full-screen hand tracking overlay -->
      <canvas id="tracking-canvas"></canvas>

      <!-- Countdown Overlay -->
      <div id="countdown-overlay" class="hidden">
        <span id="countdown-text"></span>
      </div>

      <!-- Camera Flash -->
      <div id="flash-overlay" class="hidden"></div>

      <!-- Save Overlay (shown after countdown + flash) -->
      <div id="save-overlay" class="hidden">
        <div id="save-card">
          <div id="save-preview">
            <img id="clay-snapshot" alt="Your Clay" />
          </div>
          <form id="save-form">
            <input
              type="text"
              id="potter-name"
              aria-label="Your name"
              required
            />
            <button type="submit" id="save-btn">Save to Gallery</button>
            <p id="save-status" aria-live="polite"></p>
          </form>
          <div id="save-actions" class="hidden">
            <button id="btn-new-pot">Make Another</button>
            <button id="btn-view-gallery">View Gallery</button>
          </div>
        </div>
      </div>

      <!-- Persistent gallery link -->
      <a
        href="/gallery.html"
        id="open-gallery-btn"
        target="pottery-gallery"
        rel="noopener noreferrer"
        >Gallery</a>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
